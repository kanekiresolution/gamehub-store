<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>GameHub — игровой магазин</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand-icon">🎮</div>
    <div><h1>GameHub</h1><p>Игровой магазин</p></div>
    <div class="balance">₽ <span>RUB</span></div>
  </header>

  <section class="hero">
    <div><span class="eyebrow">GAME STORE</span><h2>Твоя игра.<br>Твои правила.</h2><p>Выбирай товары и оформляй заказ</p></div>
    <div class="hero-art">⚡</div>
  </section>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-category="all">Все</button>
    <button class="tab" data-category="supercell">Supercell</button>
    <button class="tab" data-category="ps">PlayStation</button>
    <button class="tab" data-category="steam">Steam</button>
  </nav>

  <main>
    <div class="section-title"><h2 id="catalog-title">Популярное</h2><span>КАТАЛОГ</span></div>
    <div id="catalog" class="catalog"></div>
  </main>

  <footer class="bottom">
    <button class="bottom-link selected" id="homeBtn">⌂<span>Главная</span></button>
    <button class="bottom-link" id="cartBtn">▦<span>Корзина <b id="cart-count">0</b></span></button>
    <button class="checkout" id="checkoutBtn">Оформить заказ · <span id="total">0 ₽</span></button>
  </footer>

  <div class="modal hidden" id="modal">
    <div class="modal-card">
      <button class="close" id="closeModal">×</button>
      <h2>Оформление заказа</h2>
      <p class="muted">Оставь контакт, чтобы продавец мог подтвердить заказ.</p>
      <label>Имя или ник<input id="customer" maxlength="100" placeholder="Как к тебе обращаться"></label>
      <label>Контакт в Telegram<input id="contact" maxlength="150" placeholder="@username (необязательно)"></label>
      <label>Комментарий к заказу<textarea id="note" maxlength="500" placeholder="Например, регион PS Store или нужный номинал"></textarea></label>
      <div class="payment-note"><b>Оплата вручную</b><p id="paymentDetails">После отправки заказа продавец сообщит дальнейшие шаги.</p></div>
      <button class="primary" id="sendOrder">Отправить заказ</button>
      <p id="status" class="status"></p>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
